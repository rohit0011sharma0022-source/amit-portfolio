<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#020617;
color:white;
}

/* NAVBAR */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#020617;
position:fixed;
width:100%;
}

.logo{
font-size:28px;
color:#3b82f6;
}

.menu{
font-size:28px;
cursor:pointer;
display:none;
}

nav a{
margin:0 15px;
text-decoration:none;
color:white;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:50px;
}

.hero span{
color:#3b82f6;
}

/* SECTIONS */

section{
padding:80px 20px;
text-align:center;
}

/* MOBILE */

@media(max-width:768px){

nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#111827;
padding:20px;
border-radius:10px;
}

nav a{
display:block;
margin:10px 0;
}

nav.active{
display:block;
}

.menu{
display:block;
}

}

</style>

</head>

<body>

<header>

<h2 class="logo">Portfolio</h2>

<div class="menu" onclick="toggleMenu()">☰</div>

<nav id="nav">

<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#skills">Skills</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>

</nav>

</header>


<section class="hero" id="home">

<h1>Hi I'm <span>Amit</span></h1>

<p>Creative Video Editor</p>

</section>


<section id="about">

<h2>About Me</h2>

<p>I am a creative video editor who loves making cinematic edits.</p>

</section>


<section id="skills">

<h2>Skills</h2>

<p>Premiere Pro • After Effects • CapCut</p>

</section>


<section id="projects">

<h2>Projects</h2>

<p>Instagram Reels • YouTube Edits • Brand Videos</p>

</section>


<section id="contact">

<h2>Contact</h2>

<p>Instagram: @amitvisuals</p>

</section>


<script>

function toggleMenu(){
document.getElementById("nav").classList.toggle("active");
}

</script>

</body>
</html>
