<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#020617;
color:white;
overflow-x:hidden;
}

/* FIX SCROLL OFFSET */
section{
scroll-margin-top:80px;
}

/* BACKGROUND GLOW */
body::before{
content:'';
position:fixed;
width:400px;
height:400px;
background:radial-gradient(circle, rgba(37,99,235,0.25), transparent);
top:20%;
left:60%;
filter:blur(100px);
z-index:-1;
}

/* NAVBAR */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.logo{
font-size:28px;
color:#3b82f6;
}

.menu{
font-size:28px;
cursor:pointer;
display:none;
}

nav{
z-index:1000;
}

nav a{
margin:0 15px;
text-decoration:none;
color:white;
}

/* HERO */
.hero{
min-height:75vh;
display:flex;
align-items:center;
padding:120px 10% 40px;
position:relative;
}

.hero-text{
max-width:700px;
}

.hero-text h4{
color:#c084fc;
font-size:22px;
margin-bottom:10px;
}

.hero-text h1{
font-size:70px;
color:#3b82f6;
margin-bottom:12px;
}

.hero-text h2{
font-size:22px;
font-weight:400;
margin-bottom:12px;
white-space:nowrap;
letter-spacing:0.5px;
}

.hero-text p{
color:#9ca3af;
margin-bottom:15px;
line-height:1.6;
}

/* ANIMATION */
.fade-up{
opacity:0;
transform:translateY(30px);
animation:fadeUp 0.8s ease forwards;
}

.fade-up.delay-1{animation-delay:0.2s;}
.fade-up.delay-2{animation-delay:0.4s;}
.fade-up.delay-3{animation-delay:0.6s;}

@keyframes fadeUp{
to{opacity:1; transform:translateY(0);}
}

/* CIRCLES */
.circle{
position:absolute;
border-radius:50%;
background:rgba(59,130,246,0.15);
}

.circle1{width:300px;height:300px;right:100px;top:120px;}
.circle2{width:200px;height:200px;right:50px;top:350px;}
.circle3{width:120px;height:120px;right:300px;bottom:100px;}

/* CTA SECTION */
.cta-section{
max-width:900px;
margin:-40px auto 0;
padding:0 20px 40px;
}

.cta-buttons{
display:flex;
flex-direction:column;
gap:16px;
margin-top:10px;
}

.btn{
display:flex;
justify-content:center;
align-items:center;
padding:18px;
border-radius:50px;
text-decoration:none;
font-size:18px;
font-weight:500;
position:relative;
overflow:hidden;
}

.btn.primary{
background:linear-gradient(90deg,#2563eb,#06b6d4);
color:white;
box-shadow:0 0 20px rgba(37,99,235,0.6);
transition:0.3s;
}

.btn.primary:hover{
transform:translateY(-3px) scale(1.02);
box-shadow:0 0 40px rgba(37,99,235,0.9);
}

.btn.secondary{
background:#111827;
border:1px solid rgba(255,255,255,0.1);
color:white;
}

/* STATS */
.stats-card{
background:rgba(255,255,255,0.03);
border-radius:20px;
padding:25px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 10px 40px rgba(0,0,0,0.4);
margin-top:30px;
transition:0.3s;
}

.status{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
color:#9ca3af;
font-size:14px;
}

.dot{
width:10px;
height:10px;
background:#22c55e;
border-radius:50%;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
text-align:center;
}

.stats-grid h2{
color:#3b82f6;
font-size:32px;
}

/* WORK */
.work-section{
padding:60px 20px;
text-align:center;
}

.work-title{
font-size:40px;
color:#3b82f6;
margin-bottom:10px;
}

.work-container{
display:flex;
flex-direction:column;
gap:20px;
max-width:900px;
margin:auto;
}

.work-card{
position:relative;
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
border-radius:25px;
padding:40px 20px;
}

.play-btn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* OFFER */
.offer-section{padding:60px 20px;}
.offer-card{
background:rgba(255,255,255,0.03);
padding:20px;
border-radius:20px;
margin-bottom:15px;
}

/* SKILLS */
.skills-section{padding:60px 20px;}
.bar{height:8px;background:#111827;border-radius:10px;}
.bar span{display:block;height:100%;background:#3b82f6;}

/* MOBILE */
@media(max-width:768px){
nav{
display:none;
position:absolute;
top:70px;
right:20px;
background:#111827;
padding:20px;
border-radius:10px;
}
nav.active{display:block;}
nav a{display:block;margin:10px 0;}
.menu{display:block;}
}

</style>
</head>

<body>

<header>
<h2 class="logo">Portfolio</h2>
<div class="menu" onclick="toggleMenu()">☰</div>

<nav id="nav">
<a href="#home" onclick="closeMenu()">Home</a>
<a href="#work" onclick="closeMenu()">Work</a>
<a href="#offer" onclick="closeMenu()">Services</a>
<a href="#skills" onclick="closeMenu()">Skills</a>
<a href="#contact" onclick="closeMenu()">Contact</a>
</nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
<div class="hero-text">
<h1>Harsh</h1>
</div>
</section>

<!-- CTA -->
<section class="cta-section" id="contact">
<a href="#work" class="btn secondary">View My Work</a>
</section>

<!-- WORK -->
<section class="work-section" id="work">
<h1 class="work-title">Recent Work</h1>
<div class="work-container">
<div class="work-card"><div class="play-btn">▶</div></div>
<div class="work-card"><div class="play-btn">▶</div></div>
</div>
</section>

<!-- SERVICES -->
<section class="offer-section" id="offer">
<h2>What I Offer</h2>
<div class="offer-card">Video Editing</div>
<div class="offer-card">Content Strategy</div>
</section>

<!-- SKILLS -->
<section class="skills-section" id="skills">
<h2>Skills</h2>
<div class="bar"><span style="width:90%"></span></div>
</section>

<script>
function toggleMenu(){
document.getElementById("nav").classList.toggle("active");
}

function closeMenu(){
document.getElementById("nav").classList.remove("active");
}
</script>

</body>
</html>
